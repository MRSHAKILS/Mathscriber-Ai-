<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - LaTeX Editor</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.4.19/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100">
    <div class="min-h-screen flex items-center justify-center">
        <div class="max-w-md w-full mx-4">
            <div class="card bg-gray-800 shadow-xl">
                <div class="card-body">
                    <h2 class="card-title text-3xl mb-6">Login to Editor</h2>
                    
                    {% if error %}
                    <div class="alert alert-error mb-4">
                        <span>{{ error }}</span>
                    </div>
                    {% endif %}
                    
                    <p class="text-gray-400 mb-6">
                        Please login through the main application first, then you'll be automatically redirected here.
                    </p>
                    
                    <div class="flex flex-col gap-4">
                        <a href="http://localhost:3000/login?redirect=editor" class="btn btn-primary">
                            Go to Main Login Page
                        </a>
                        
                        <div class="divider">OR</div>
                        
                        <div class="text-sm text-gray-500">
                            <p class="mb-2">If you're already logged in to the main app:</p>
                            <button onclick="loginWithToken()" class="btn btn-sm btn-outline w-full">
                                Login with Token
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function loginWithToken() {
            // Try to get token from main app (if in same origin)
            const token = localStorage.getItem('token');
            
            if (!token) {
                alert('No token found. Please login through the main application first.');
                window.location.href = 'http://localhost:3000/login?redirect=editor';
                return;
            }
            
            try {
                const response = await fetch('{% url "editor:editor_login" %}?next={{ next|urlencode }}', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ token: token })
                });
                
                if (response.redirected) {
                    window.location.href = response.url;
                } else {
                    const data = await response.text();
                    document.body.innerHTML = data;
                }
            } catch (error) {
                alert('Login failed: ' + error.message);
            }
        }
        
        // Auto-try login if token exists
        window.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('token');
            if (token) {
                loginWithToken();
            }
        });
    </script>
</body>
</html>
