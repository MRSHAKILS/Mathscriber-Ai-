{% extends 'base.html' %}

{% block title %}Scanner - MathScriber{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-12">
    <h1 class="text-4xl font-bold mb-8 text-center">Camera Scanner</h1>
    
    <div class="max-w-4xl mx-auto bg-white dark:bg-gray-800 rounded-lg shadow-lg p-8">
        <div class="relative">
            <video id="camera" class="w-full rounded border-4 border-dashed border-green-500" autoplay></video>
            <canvas id="canvas" class="hidden"></canvas>
            
            <!-- Overlay Guide -->
            <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 pointer-events-none">
                <div class="border-4 border-dashed border-green-400 rounded" style="width: 600px; height: 400px;"></div>
            </div>
        </div>
        
        <div class="flex gap-4 mt-6 justify-center">
            <button id="capture-btn" class="btn-primary px-8 py-3">
                <i class="bi bi-camera"></i> Capture
            </button>
            <button id="retake-btn" class="hidden bg-gray-500 text-white px-8 py-3 rounded-lg hover:bg-gray-600">
                <i class="bi bi-arrow-clockwise"></i> Retake
            </button>
            <button id="process-btn" class="hidden bg-green-500 text-white px-8 py-3 rounded-lg hover:bg-green-600">
                <i class="bi bi-magic"></i> Process
            </button>
        </div>
    </div>
</div>

<script>
const video = document.getElementById('camera');
const canvas = document.getElementById('canvas');
const captureBtn = document.getElementById('capture-btn');
const retakeBtn = document.getElementById('retake-btn');
const processBtn = document.getElementById('process-btn');

// Access camera
navigator.mediaDevices.getUserMedia({ video: { width: 1200, height: 800 } })
    .then(stream => {
        video.srcObject = stream;
    })
    .catch(err => {
        alert('Camera access denied. Please enable camera permissions.');
    });

captureBtn.addEventListener('click', () => {
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext('2d').drawImage(video, 0, 0);
    
    video.classList.add('hidden');
    canvas.classList.remove('hidden');
    captureBtn.classList.add('hidden');
    retakeBtn.classList.remove('hidden');
    processBtn.classList.remove('hidden');
});

retakeBtn.addEventListener('click', () => {
    canvas.classList.add('hidden');
    video.classList.remove('hidden');
    captureBtn.classList.remove('hidden');
    retakeBtn.classList.add('hidden');
    processBtn.classList.add('hidden');
});

processBtn.addEventListener('click', () => {
    // Convert canvas to blob and upload
    canvas.toBlob(blob => {
        const formData = new FormData();
        formData.append('image', blob, 'capture.png');
        
        // Redirect to upload page (implement actual upload logic)
        showNotification('Image captured! Redirecting to upload...', 'success');
        setTimeout(() => {
            window.location.href = '{% url "converter:upload" %}';
        }, 1000);
    });
});
</script>
{% endblock %}
