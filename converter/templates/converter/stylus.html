{% extends 'base.html' %}

{% block title %}Drawing Canvas - MathScriber{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-12">
    <h1 class="text-4xl font-bold mb-8 text-center">Drawing Canvas</h1>
    
    <div class="max-w-4xl mx-auto bg-white dark:bg-gray-800 rounded-lg shadow-lg p-4 sm:p-8">
        <div class="relative w-full" style="padding-top: 75%;"> <!-- 4:3 aspect ratio -->
            <canvas id="drawing-canvas"
                    class="absolute top-0 left-0 w-full h-full border-2 border-gray-300 dark:border-gray-600 rounded cursor-crosshair bg-white">
            </canvas>
        </div>
        
        <div class="flex flex-col sm:flex-row gap-3 sm:gap-4 mt-6 justify-center">
            <button id="clear-btn" class="bg-gray-500 text-white px-6 py-3 rounded-lg hover:bg-gray-600 text-base sm:text-lg w-full sm:w-auto">
                <i class="bi bi-trash"></i> Clear
            </button>
            <button id="process-btn" class="btn-primary px-6 py-3 text-base sm:text-lg w-full sm:w-auto">
                <i class="bi bi-magic"></i> Convert to LaTeX
            </button>
        </div>
    </div>
</div>

<script>
const canvas = document.getElementById('drawing-canvas');
const ctx = canvas.getContext('2d');
let isDrawing = false;
let lastX = 0;
let lastY = 0;

// Set canvas size to match display size
function resizeCanvas() {
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width;
    canvas.height = rect.height;
    
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
}

// Initial resize
resizeCanvas();

// Resize on window resize
window.addEventListener('resize', resizeCanvas);

function getCoordinates(e) {
    const rect = canvas.getBoundingClientRect();
    if (e.touches && e.touches[0]) {
        return [
            e.touches[0].clientX - rect.left,
            e.touches[0].clientY - rect.top
        ];
    }
    return [e.offsetX, e.offsetY];
}

function startDrawing(e) {
    isDrawing = true;
    [lastX, lastY] = getCoordinates(e);
}

function draw(e) {
    if (!isDrawing) return;
    
    const [x, y] = getCoordinates(e);
    
    ctx.beginPath();
    ctx.moveTo(lastX, lastY);
    ctx.lineTo(x, y);
    ctx.stroke();
    
    [lastX, lastY] = [x, y];
}

function stopDrawing() {
    isDrawing = false;
}

// Mouse events
canvas.addEventListener('mousedown', startDrawing);
canvas.addEventListener('mousemove', draw);
canvas.addEventListener('mouseup', stopDrawing);
canvas.addEventListener('mouseout', stopDrawing);

// Touch events for stylus/mobile
canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    startDrawing(e);
});
canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    draw(e);
});
canvas.addEventListener('touchend', stopDrawing);

// Clear canvas
document.getElementById('clear-btn').addEventListener('click', () => {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
});

// Process drawing
document.getElementById('process-btn').addEventListener('click', () => {
    canvas.toBlob(blob => {
        const formData = new FormData();
        formData.append('image', blob, 'drawing.png');
        
        showNotification('Drawing captured! Redirecting to upload...', 'success');
        setTimeout(() => {
            window.location.href = '{% url "converter:upload" %}';
        }, 1000);
    });
});
</script>
{% endblock %}
