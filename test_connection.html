<!DOCTYPE html>
<html>
<head>
    <title>Quick Connection Test</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #f0f0f0; }
        .test { margin: 10px 0; padding: 15px; border-radius: 5px; }
        .success { background: #d4edda; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; border: 1px solid #f5c6cb; }
        .info { background: #d1ecf1; border: 1px solid #bee5eb; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        pre { background: #282c34; color: #abb2bf; padding: 10px; border-radius: 5px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>🔍 Connection Diagnostic</h1>
    <button onclick="testBackend()">Test Backend Connection</button>
    <button onclick="testCORS()">Test CORS</button>
    <button onclick="testWithFile()">Test with Dummy File</button>
    <div id="results"></div>

    <script>
        const results = document.getElementById('results');

        function log(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `test ${type}`;
            div.innerHTML = message;
            results.appendChild(div);
        }

        async function testBackend() {
            results.innerHTML = '';
            log('Testing backend endpoints...', 'info');

            const endpoints = [
                'http://localhost:8000/api/convert/upload',
                'http://127.0.0.1:8000/api/convert/upload',
            ];

            for (const url of endpoints) {
                try {
                    log(`Testing: ${url}`, 'info');
                    const response = await fetch(url, { method: 'POST' });
                    const data = await response.json();
                    
                    if (response.status === 400 && data.error === 'No image provided') {
                        log(`✅ ${url}<br>Status: ${response.status}<br>Message: ${data.error}`, 'success');
                    } else {
                        log(`⚠️ ${url}<br>Status: ${response.status}<br>Data: ${JSON.stringify(data)}`, 'error');
                    }
                } catch (error) {
                    log(`❌ ${url}<br>Error: ${error.message}`, 'error');
                }
            }
        }

        async function testCORS() {
            results.innerHTML = '';
            log('Testing CORS headers...', 'info');

            try {
                const response = await fetch('http://localhost:8000/api/convert/upload', {
                    method: 'OPTIONS'
                });
                
                log(`CORS Preflight Status: ${response.status}`, 
                    response.status === 200 ? 'success' : 'error');
                
                const headers = {};
                response.headers.forEach((value, key) => {
                    headers[key] = value;
                });
                
                log(`<pre>Headers:\n${JSON.stringify(headers, null, 2)}</pre>`, 'info');
            } catch (error) {
                log(`CORS Test Failed: ${error.message}`, 'error');
            }
        }

        async function testWithFile() {
            results.innerHTML = '';
            log('Creating dummy file and testing upload...', 'info');

            try {
                // Create a small 1x1 red pixel PNG
                const canvas = document.createElement('canvas');
                canvas.width = 1;
                canvas.height = 1;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = 'red';
                ctx.fillRect(0, 0, 1, 1);

                canvas.toBlob(async (blob) => {
                    const file = new File([blob], 'test.png', { type: 'image/png' });
                    const formData = new FormData();
                    formData.append('image', file);

                    log('Sending file to backend...', 'info');

                    try {
                        const response = await fetch('http://localhost:8000/api/convert/upload', {
                            method: 'POST',
                            body: formData
                        });

                        const data = await response.json();
                        
                        if (response.ok) {
                            log(`✅ Upload Successful!<br>Status: ${response.status}<br>Response:<pre>${JSON.stringify(data, null, 2)}</pre>`, 'success');
                        } else {
                            log(`⚠️ Upload Failed<br>Status: ${response.status}<br>Response:<pre>${JSON.stringify(data, null, 2)}</pre>`, 'error');
                        }
                    } catch (error) {
                        log(`❌ Upload Error: ${error.message}`, 'error');
                    }
                }, 'image/png');
            } catch (error) {
                log(`❌ File Creation Error: ${error.message}`, 'error');
            }
        }

        // Auto-run basic test on load
        window.onload = () => {
            log('Page loaded. Click buttons above to run tests.', 'info');
        };
    </script>
</body>
</html>
