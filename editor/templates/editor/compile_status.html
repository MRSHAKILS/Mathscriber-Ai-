<!-- editor/templates/editor/compile_status.html -->
{% extends "editor/base1.html" %}
{% block content %}
<div class="max-w-4xl mx-auto p-6 animate-fade-in">
  <div class="bg-white dark:bg-stone-800 rounded-xl shadow-lg border border-stone-200 dark:border-stone-700 overflow-hidden">
    <!-- Header -->
    <div class="bg-gradient-to-r from-teal-50 to-blue-50 dark:from-stone-700 dark:to-stone-800 px-6 py-4 border-b border-stone-200 dark:border-stone-700">
      <h2 class="text-2xl font-bold text-stone-900 dark:text-white flex items-center gap-2">
        <i class="bi bi-info-circle text-teal-600"></i>
        Compile Status: 
        <span class="{% if run.status == 'success' %}text-green-600{% elif run.status == 'error' %}text-red-600{% else %}text-yellow-600{% endif %}">
          {{ run.status|title }}
        </span>
      </h2>
    </div>
    
    <!-- Content -->
    <div class="p-6">
      {% if run.status == 'success' %}
        <div class="flex items-center gap-4 mb-6 p-4 bg-green-50 dark:bg-green-900/20 rounded-lg border border-green-200 dark:border-green-800">
          <i class="bi bi-check-circle-fill text-3xl text-green-600"></i>
          <div>
            <h3 class="font-semibold text-green-900 dark:text-green-300 mb-1">Compilation Successful!</h3>
            <p class="text-sm text-green-700 dark:text-green-400">Your PDF has been generated successfully.</p>
          </div>
        </div>
        <a href="{% url 'editor:download_pdf' pk=project.pk run_id=run.pk %}" 
           class="inline-flex items-center gap-2 px-6 py-3 bg-gradient-to-r from-teal-600 to-blue-600 hover:from-teal-700 hover:to-blue-700 text-white font-semibold rounded-lg shadow-md hover:shadow-lg transition-all duration-300 hover:scale-105">
          <i class="bi bi-download text-lg"></i>
          Download PDF
        </a>
      {% endif %}
      
      {% if run.log %}
        <div class="mt-6">
          <h3 class="text-lg font-semibold text-stone-900 dark:text-white mb-3 flex items-center gap-2">
            <i class="bi bi-terminal text-stone-600"></i>
            Compilation Log
          </h3>
          <pre class="p-4 bg-stone-50 dark:bg-stone-900 border border-stone-200 dark:border-stone-700 rounded-lg text-sm text-stone-800 dark:text-stone-200 overflow-auto max-h-96 whitespace-pre-wrap">{{ run.log }}</pre>
        </div>
      {% endif %}
    </div>
  </div>
</div>

<style>
  @keyframes fade-in {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .animate-fade-in {
    animation: fade-in 0.5s ease-out;
  }
</style>
{% endblock %}
